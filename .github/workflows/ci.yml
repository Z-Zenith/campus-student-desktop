name: Student Desktop CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  student-desktop-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build SEK WebView host bundle
        run: npm ci && npm run build:host
        working-directory: external/shared-editor-kit

      - name: Build DMS WebView host bundle
        run: npm ci && npm run build:host
        working-directory: external/direct-messaging

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test StudentDesktop.Tests -c Release

      - name: Check for vulnerable NuGet packages
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.log
          # GHSA-2m69-gcr7-jv3q (SQLitePCLRaw.lib.e_sqlite3 2.1.11, pulled in transitively
          # by Microsoft.Data.Sqlite) is a known, already-triaged exception — see the
          # NuGetAuditSuppress comment in StudentDesktop.csproj: no patched version exists
          # upstream yet, and the app never actually uses that plain provider to parse SQL
          # (raw.SetProvider always selects e_sqlcipher instead). `dotnet list package
          # --vulnerable` doesn't honor NuGetAuditSuppress, so filter just that advisory's
          # row out here before failing — any *other* vulnerable package should still fail
          # the build.
          if grep -E '^\s*>' vuln.log | grep -v 'GHSA-2m69-gcr7-jv3q' | grep -q .; then
            echo "::error::Vulnerable NuGet package(s) detected"
            exit 1
          fi
